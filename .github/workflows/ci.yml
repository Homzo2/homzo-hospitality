name: Homzo CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Start Server in background
        run: |
          node server.js &
          sleep 5

      - name: Run Integration Tests
        run: npm run qa-test

      - name: Run Browser/Asset Verification Tests
        run: node qa_browser_test.js
